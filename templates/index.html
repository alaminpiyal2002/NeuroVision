{% extends "base.html" %}
{% block content %}

<style>
/* PAGE-SPECIFIC CSS — SAFE with base.html */

.upload-section {
    margin-top: 40px;
    padding: 10px 60px 40px;
    position: relative;
    z-index: 10;
}

.upload-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    flex-direction: column;
    gap: 25px;
}

.upload-card {
    background: rgba(10,10,10,0.85);
    border: 1px solid rgba(255,215,0,0.35);
    border-radius: 18px;
    padding: 26px;
    backdrop-filter: blur(10px);
    transition: 0.3s;
}

.upload-card:hover {
    border-color: rgba(255,215,0,0.6);
    transform: translateY(-5px);
}

.upload-card h2 {
    color: #FFD700;
    font-size: 1.5rem;
    margin-bottom: 10px;
    font-weight: 700;
}

.upload-card p.subtitle {
    color: rgba(255,255,255,0.7);
    margin-bottom: 15px;
}

.upload-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 16px 20px;
}

.upload-label {
    font-size: 0.9rem;
    color: rgba(255,255,255,0.85);
    margin-bottom: 5px;
    display: block;
}

.upload-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,215,0,0.3);
    color: #fff;
}

.upload-input:focus {
    border-color: #FFD700;
    outline: none;
}

.btn-upload {
    margin-top: 18px;
    background: linear-gradient(135deg,#FFD700,#FFC700);
    color: #000;
    padding: 12px 28px;
    border-radius: 28px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: 0.3s;
}

.btn-upload:hover {
    transform: translateY(-2px);
}

.alert {
    margin-top: 14px;
    padding: 12px;
    border-radius: 10px;
}

.alert-success {
    background: rgba(0,190,100,0.15);
    border: 1px solid rgba(0,190,100,0.5);
}

.alert-danger {
    background: rgba(200,40,40,0.15);
    border: 1px solid rgba(200,40,40,0.5);
}

.d-none { display: none !important; }

.loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity .3s;
}

.hidden {
    opacity: 0;
    pointer-events: none;
}

.spinner {
    border: 6px solid rgba(255,255,255,0.1);
    border-top: 6px solid #FFD700;
    border-radius: 50%;
    width: 70px;
    height: 70px;
    animation: spin 1s linear infinite;
    margin-bottom: 1rem;
}

@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 700px) {
    .upload-grid { grid-template-columns: 1fr; }
}
</style>

<!-- UPLOAD SECTION -->
<section class="upload-section">
    <div class="upload-inner">

        <!-- Individual MRI Upload -->
        <div class="upload-card">
            <h2>🧬 Upload Individual MRI Sequences</h2>
            <p class="subtitle">Upload T1, T1C, T2, and FLAIR for a given patient & timepoint.</p>

            <form id="uploadForm" enctype="multipart/form-data">
                <div class="upload-grid">

                    <div>
                        <label class="upload-label">Patient ID</label>
                        <input type="text" name="patientID" id="patientID" class="upload-input" required>
                    </div>

                    <div>
                        <label class="upload-label">Timepoint</label>
                        <input type="text" name="timepoint" id="timepoint" class="upload-input" required>
                    </div>

                    <div>
                        <label class="upload-label">T1-weighted (T1)</label>
                        <input type="file" name="t1n" id="t1n" class="upload-input" required>
                    </div>

                    <div>
                        <label class="upload-label">T1-Contrast (T1C)</label>
                        <input type="file" name="tc1" id="tc1" class="upload-input" required>
                    </div>

                    <div>
                        <label class="upload-label">T2-weighted (T2)</label>
                        <input type="file" name="t2w" id="t2w" class="upload-input" required>
                    </div>

                    <div>
                        <label class="upload-label">FLAIR (T2-FLAIR)</label>
                        <input type="file" name="t2f" id="t2f" class="upload-input" required>
                    </div>

                </div>

                <button type="submit" class="btn-upload">Process Files</button>
            </form>

            <div id="result" class="alert alert-success d-none"></div>
            <div id="error" class="alert alert-danger d-none"></div>
        </div>

        <!-- ZIP Upload -->
        <div class="upload-card">
            <h2>📦 Upload ZIP Dataset</h2>
            <p class="subtitle">Upload a ZIP containing patient/timepoint MRI folders.</p>

            <form id="zipForm" enctype="multipart/form-data">
                <label class="upload-label">ZIP File</label>
                <input type="file" id="zipfile" name="zipfile" accept=".zip" class="upload-input" required>

                <button type="submit" class="btn-upload">Process ZIP</button>
            </form>

            <div id="zipResult" class="alert alert-success d-none"></div>
            <div id="zipError" class="alert alert-danger d-none"></div>
        </div>

    </div>
</section>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="loading-overlay hidden">
    <div class="spinner"></div>
    <p>Processing your files... please wait.</p>
</div>

<!-- JS HANDLERS -->
<script>
const overlay = document.getElementById("loadingOverlay");
function showLoading(){ overlay.classList.remove("hidden"); }
function hideLoading(){ overlay.classList.add("hidden"); }

document.getElementById("uploadForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    showLoading();

    let fd = new FormData(e.target);
    let resBox = document.getElementById("result");
    let errBox = document.getElementById("error");

    resBox.classList.add("d-none");
    errBox.classList.add("d-none");

    try {
        let res = await fetch("/upload_files", { method:"POST", body:fd });
        let data = await res.json();
        hideLoading();

        if(data.success){
            resBox.innerHTML = `✅ Complete<br>Patient: <b>${data.patient}</b> — Timepoint: <b>${data.timepoint}</b>`;
            resBox.classList.remove("d-none");
        } else {
            errBox.textContent = data.error;
            errBox.classList.remove("d-none");
        }

    } catch(err){
        hideLoading();
        errBox.textContent = "Network error: " + err.message;
        errBox.classList.remove("d-none");
    }
});

document.getElementById("zipForm").addEventListener("submit", async e => {
    e.preventDefault();
    showLoading();

    let fd = new FormData(e.target);
    let resBox = document.getElementById("zipResult");
    let errBox = document.getElementById("zipError");

    resBox.classList.add("d-none");
    errBox.classList.add("d-none");

    try {
        let res = await fetch("/upload_zip", { method:"POST", body:fd });
        let data = await res.json();
        hideLoading();

        if(data.success){
            resBox.textContent = "ZIP processed successfully!";
            resBox.classList.remove("d-none");
        } else {
            errBox.textContent = data.error;
            errBox.classList.remove("d-none");
        }

    } catch(err){
        hideLoading();
        errBox.textContent = "Network error: " + err.message;
        errBox.classList.remove("d-none");
    }
});
</script>

{% endblock %}
